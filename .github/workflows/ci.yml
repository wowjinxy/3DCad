name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows MSVC x64 (${{ matrix.buildtype }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        buildtype: [debug, release]

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Meson and Ninja
        run: python -m pip install --disable-pip-version-check meson ninja

      - name: Download and verify the latest SDL3 VC development archive
        shell: pwsh
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/libsdl-org/SDL/releases/latest"
          $assets = @($release.assets | Where-Object {
            $_.name -match '^SDL3-devel-[0-9.]+-VC\.zip$'
          })
          if ($assets.Count -ne 1) {
            throw "Expected one SDL3 VC development archive, found $($assets.Count)"
          }
          $asset = $assets[0]
          if ($asset.digest -notmatch '^sha256:([0-9a-fA-F]{64})$') {
            throw "The SDL release API did not provide a SHA-256 digest"
          }
          $expected = $Matches[1].ToLowerInvariant()
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url `
            -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SDL archive digest mismatch: expected $expected, got $actual"
          }
          $destination = Join-Path $env:RUNNER_TEMP "SDL3-vc"
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $roots = @(Get-ChildItem -LiteralPath $destination -Directory |
            Where-Object {
              (Test-Path (Join-Path $_.FullName "include\SDL3\SDL.h")) -and
              (Test-Path (Join-Path $_.FullName "lib\x64\SDL3.lib"))
            })
          if ($roots.Count -ne 1) {
            throw "Could not locate the verified SDL3 VC development root"
          }
          "SDL3_ROOT=$($roots[0].FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $roots[0].FullName "lib\x64") | Out-File `
            -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: >-
          meson setup build/msvc
          --backend=ninja
          --buildtype=${{ matrix.buildtype }}
          -Dgui=enabled
          -Dtools=true
          -Dtests=true
          -Dwerror=true
          -Dsdl3_root="$env:SDL3_ROOT"

      - name: Build
        run: meson compile -C build/msvc

      - name: Test
        run: meson test -C build/msvc --print-errorlogs

  windows-mingw:
    name: Windows MinGW-w64 UCRT64
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3

      - name: Configure
        run: >-
          meson setup build/mingw
          --buildtype=debugoptimized
          -Dgui=enabled
          -Dtools=true
          -Dtests=true
          -Dwerror=true

      - name: Build
        run: meson compile -C build/mingw

      - name: Test
        run: meson test -C build/mingw --print-errorlogs

  linux-core:
    name: Linux Clang ASan/UBSan core, tools, and tests
    runs-on: ubuntu-24.04

    env:
      CC: clang
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          python -m pip install --disable-pip-version-check meson ninja

      - name: Configure without GUI dependencies
        run: >-
          meson setup build/linux-core
          --buildtype=debugoptimized
          -Dgui=disabled
          -Dtools=true
          -Dtests=true
          -Db_sanitize=address,undefined
          -Dwerror=true

      - name: Build
        run: meson compile -C build/linux-core

      - name: Test
        run: meson test -C build/linux-core --print-errorlogs

  linux-gui:
    name: Linux SDL3/OpenGL GUI, tests, and smoke test
    runs-on: ubuntu-26.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install GUI and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config \
            libsdl3-dev libgl-dev libgl1-mesa-dri \
            xvfb xauth

      - name: Configure
        run: >-
          meson setup build/linux-gui
          --buildtype=debugoptimized
          -Dgui=enabled
          -Dtools=true
          -Dtests=true
          -Dwerror=true

      - name: Build
        run: meson compile -C build/linux-gui

      - name: Test
        run: meson test -C build/linux-gui --print-errorlogs

      - name: Run one hidden GUI frame with software OpenGL
        run: >-
          timeout 30s xvfb-run -a
          -s "-screen 0 1280x1024x24 +extension GLX"
          env LIBGL_ALWAYS_SOFTWARE=1
          ./build/linux-gui/3DCadGui --smoke-test
